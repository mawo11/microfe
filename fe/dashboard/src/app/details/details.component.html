<div class="dashboard">
    <h1>Dashboard Details</h1>
    <p>To jest strona z szczegółami dashboardu.</p>
    <button class="btn btn-primary" (click)="router.navigate(['/'])">Powrót do Home</button>

    <table>
        <tr>
            <th>klucz</th>
            <th>wartosc</th>
        </tr>

        </tr>
    </table>
</div>
